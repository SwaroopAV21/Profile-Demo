apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-backup
  namespace: portfolio
spec:
  replicas: 1
  selector:
    matchLabels: { app: db-backup }
  template:
    metadata:
      labels: { app: db-backup }
    spec:
      nodeSelector: { role: db-backup }
      containers:
        - name: postgres
          image: swaroopav/postgresdb:main
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: db-secret }