apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: portfolio
spec:
  replicas: 4
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend, tier: primary }
    spec:
      nodeSelector: { role: backend }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: backend, tier: primary }
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: backend
          image: swaroopav/java-profile:main
          ports: [{ containerPort: 8080 }]
          env:
            - { name: DB_HOST, value: db }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: portfolio_db }
            - { name: DB_USER, value: postgres }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: POSTGRES_PASSWORD }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5