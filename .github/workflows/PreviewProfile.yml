name: "Preview Profile"
run-name: "Preview Profile - ${{ github.event_name }} - ${{ github.ref_name }}"

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start containers
        run: |
          docker compose up -d --wait || (docker compose logs db && exit 1)
          sleep 20
          
          curl -f http://localhost:5173

          echo " ==================="
          curl -i http://localhost:5173/api/projects/featured

      - name: Open public link
        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared tunnel --url http://localhost:5173 2>&1 | tee tunnel.log &
          sleep 15
          
          URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
          echo "Tunnel: $URL"

          echo "=== API through the tunnel ==="
          curl -s -o /dev/null -w "%{http_code}\n" "$URL/api/projects/featured"

          echo "===================================="
          curl -i http://localhost:5173/api/projects/featured
           echo "===================================="

          sleep 180

      - name: Stop containers
        if: always()
        run: |
          docker compose ps

          docker compose logs backend


          docker compose down
