name: Build All Applications
run-name: ${{ inputs.run-name || 'Building all applications' }} 


on:
    workflow_dispatch:
        inputs:
            run-name:
                description: 'For Custom run name with versions'
                required: false
                type: string
                default: 'Build FrontEnd, Middleware, Backend'
            build-frontend:
                description: 'To only pick frontend to build & push'
                required: false
                type: boolean
                default: true
            build-middleware:
                description: 'To only pick middleware to build & push'
                required: false
                type: boolean
                default: true
            build-backend:
                description: 'To only pick backend, DB to build & push'
                required: false
                type: boolean
                default: true


permissions:
    contents: read
    packages: write

jobs:
  build_frontend:
    if: ${{ inputs.build-frontend == true}}
    uses: SwaroopAV21/portfolio-frontend/.github/workflows/build.yml@main
    with:
      workflow_callType: 'workflow_call'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build_middleware:
    if: ${{ inputs.build-middleware == true}}
    uses: SwaroopAV21/messaging-queue/.github/workflows/build.yml@main
    with:
      workflow_callType: 'workflow_call'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build_backend:
    if: ${{ inputs.build-backend == true}}
    uses: SwaroopAV21/javaProfile/.github/workflows/build.yml@main
    with:
      workflow_callType: 'workflow_call'
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                
