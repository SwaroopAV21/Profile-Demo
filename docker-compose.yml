services:
  db:
    image: swaroopav/db:main
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: swaroopav/backend:main
    container_name: backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: portfolio_db
      DB_USER: postgres
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    
  middleware:
    image: swaroopav/gomiddleware:main
    container_name: middleware
    restart: unless-stopped
    environment:
      BASE_URL: http://backend:8080
      DB_URL: db
      DB_PORT: 5432
      DB_NAME: messaging_queue
      POSTGRES_DB: messaging_queue
      POSTGRES_USER: postgres
      POSTGRES_PASS: root
    ports:
      - "8081:8081"
    depends_on:
      - backend

  frontend:
    image: swaroopav/frontend:main
    container_name: frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
